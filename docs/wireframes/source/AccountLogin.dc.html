<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/phoenixevent/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1c1c1c}a:hover{color:#000000}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 800px; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">
<header style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-8); background: var(--surface-raised); border-bottom: 1px solid var(--border)">
<span style="font: 700 19px/26px var(--font-sans)">PhoenixEvent</span>
</header>
<main style="padding: var(--space-12) var(--space-6); display: flex; flex-direction: column; align-items: center; gap: var(--space-4)">
<div class="pe-login">
<div style="display: flex; flex-direction: column; gap: var(--space-1)">
<h1 class="pe-login__title">Log in</h1>
<p class="pe-login__org">Lincoln Elementary PTA · <a class="pe-link" href="AccountOrg.dc.html">Change organization</a></p>
</div>
<div class="pe-field">
<label class="pe-field__label" for="username">Username</label>
<input class="pe-input" id="username" name="username" autocomplete="username">
<span class="pe-field__hint">Your username or your email address. Both work, even after you choose a username.</span>
</div>
<div class="pe-field">
<label class="pe-field__label" for="password">Password</label>
<div class="pe-password">
<input class="pe-input" id="password" name="password" type="{{pwType}}" autocomplete="current-password">
<button class="pe-btn pe-btn--secondary" type="button" aria-controls="password" aria-pressed="{{pwPressed}}" onClick="{{togglePw}}">{{pwLabel}}</button>
</div>
<span class="pe-field__hint" role="status">{{pwStatus}}</span>
</div>
<div class="pe-login__foot">
<a class="pe-link" href="AccountForgot.dc.html">Forgot password?</a>
<a class="pe-btn pe-btn--primary" href="Main.dc.html">Log in</a>
</div>
</div>
<p style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted)">New to PhoenixEvent? <a class="pe-link" href="AccountCreate.dc.html">Create account</a></p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["greystone","sunbeam","moonshadow"],"default":"greystone"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const shown = !!(this.state && this.state.shown);
return {
theme: this.props.theme ?? 'greystone',
pwType: shown ? 'text' : 'password',
pwLabel: shown ? 'Hide' : 'Show',
pwPressed: shown ? 'true' : 'false',
pwStatus: shown ? 'Password is visible.' : 'Password is hidden.',
togglePw: () => this.setState({ shown: !shown })
};
}
}
</script>
</body>
</html>
