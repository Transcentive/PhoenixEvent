<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assign member</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/phoenixevent/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1c1c1c}a:hover{color:#000000}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 700px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
<div class="pe-scrim" style="flex-grow: 1; min-height: 700px">
<div class="pe-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
<h1 class="pe-dialog__title" id="dialog-title">Assign member to Haunted Hallway</h1>
<p class="pe-dialog__body">9 of 10 spots taken, including the chair. This assignment fills the station.</p>
<div class="pe-field"><label class="pe-field__label" for="assignee">Member</label><select class="pe-input" id="assignee" name="assignee"><option>Choose a member</option><option>[MEMBER NAME], in 0 other stations</option><option>[MEMBER NAME], in 1 other station</option></select><span class="pe-field__hint">The list holds people with an approved registration for Halloween Bash.</span></div>
<div class="pe-dialog__actions">
<a class="pe-btn pe-btn--secondary" href="SetupRoster.dc.html">Cancel</a>
<a class="pe-btn pe-btn--primary" href="SetupRoster.dc.html">Assign member</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["greystone","sunbeam","moonshadow"],"default":"greystone"},"$preview":{"width":1280,"height":750}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'greystone' };
}
}
</script>
</body>
</html>
