<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>External link warning</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/phoenixevent/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1c1c1c}a:hover{color:#000000}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 900px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-8); background: var(--surface-raised); border-bottom: 1px solid var(--border)">
<span style="font: 700 19px/26px var(--font-sans)">PhoenixEvent</span>
<span style="display: inline-flex; align-items: center; gap: var(--space-1); font: 400 14px/20px var(--font-sans); color: var(--ink-muted)"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="1"></rect><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 20v-4h4v4"></path></svg>Lincoln Elementary PTA</span>
</header>
<div class="pe-scrim" style="flex-grow: 1; min-height: 780px">
<div class="pe-dialog" role="alertdialog" aria-modal="true" aria-labelledby="leave-title" aria-describedby="leave-body">
<h1 class="pe-dialog__title" id="leave-title"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>You are leaving PhoenixEvent</h1>
<p class="pe-dialog__body" id="leave-body">This link opens a site outside Lincoln Elementary PTA. Check the address before you continue.</p>
<p class="pe-dialog__dest">[FULL DESTINATION ADDRESS]</p>
<div class="pe-dialog__actions">
<a class="pe-btn pe-btn--secondary" href="CommList.dc.html">Cancel</a>
<a class="pe-btn pe-btn--primary" href="#">Continue <svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M11 7H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"></path></svg></a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["greystone","sunbeam","moonshadow"],"default":"greystone"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'greystone' };
}
}
</script>
</body>
</html>
