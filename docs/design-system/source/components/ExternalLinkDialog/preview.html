<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExternalLinkDialog</title>
<style>html,body{margin:0}body{padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>
</head>
<body>
<div class="pe-scrim" style="min-height:282px;border-radius:var(--radius-lg)">
<div class="pe-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd">
<h2 class="pe-dialog__title" id="dt"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>You are leaving PhoenixEvent</h2>
<p class="pe-dialog__body" id="dd">This link opens a site outside Lincoln Elementary PTA. Check the address before you continue.</p>
<p class="pe-dialog__dest">https://signup.example.org/halloween-bash/supplies</p>
<div class="pe-dialog__actions"><button class="pe-btn pe-btn--secondary">Cancel</button><button class="pe-btn pe-btn--primary">Continue <svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M11 7H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"/></svg></button></div>
</div></div>
</body>
</html>
