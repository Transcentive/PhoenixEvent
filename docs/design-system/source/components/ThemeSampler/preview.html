<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ThemeSampler</title>
<style>html,body{margin:0}body{padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}body{padding:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);min-width:840px}.th{padding:var(--space-6);background:var(--surface);color:var(--ink);display:grid;gap:var(--space-4);align-content:start}.hd{display:flex;justify-content:space-between;align-items:baseline;font:400 14px/20px var(--font-sans)}.hd span{color:var(--ink-muted)}.hd strong{font:600 16px/24px var(--font-sans)}</style>
</head>
<body>
<div class="grid"><section class="th" data-theme="sunbeam"><div class="hd"><strong>Sunbeam</strong><span>Light</span></div>
<div class="pe-card"><div style="display:grid;gap:var(--space-3)"><div style="font:600 19px/26px var(--font-sans)">Bake Sale</div>
<div style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><span class="pe-badge pe-badge--positive"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Open</span><span class="pe-badge pe-badge--caution"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg>Waiting list</span><span class="pe-badge pe-badge--critical"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Full</span><span class="pe-badge pe-badge--neutral"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private</span></div>
<p style="margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)">7 of 8 places taken. <a class="pe-link" href="#">See the station</a></p>
<div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="pe-btn pe-btn--primary">Register</button><button class="pe-btn pe-btn--secondary">Cancel</button></div></div></div></section><section class="th" data-theme="moonshadow"><div class="hd"><strong>Moonshadow</strong><span>Dark</span></div>
<div class="pe-card"><div style="display:grid;gap:var(--space-3)"><div style="font:600 19px/26px var(--font-sans)">Bake Sale</div>
<div style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><span class="pe-badge pe-badge--positive"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Open</span><span class="pe-badge pe-badge--caution"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg>Waiting list</span><span class="pe-badge pe-badge--critical"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Full</span><span class="pe-badge pe-badge--neutral"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private</span></div>
<p style="margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)">7 of 8 places taken. <a class="pe-link" href="#">See the station</a></p>
<div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="pe-btn pe-btn--primary">Register</button><button class="pe-btn pe-btn--secondary">Cancel</button></div></div></div></section><section class="th" data-theme="greystone"><div class="hd"><strong>Greystone</strong><span>Neutral</span></div>
<div class="pe-card"><div style="display:grid;gap:var(--space-3)"><div style="font:600 19px/26px var(--font-sans)">Bake Sale</div>
<div style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><span class="pe-badge pe-badge--positive"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Open</span><span class="pe-badge pe-badge--caution"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg>Waiting list</span><span class="pe-badge pe-badge--critical"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Full</span><span class="pe-badge pe-badge--neutral"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private</span></div>
<p style="margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)">7 of 8 places taken. <a class="pe-link" href="#">See the station</a></p>
<div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="pe-btn pe-btn--primary">Register</button><button class="pe-btn pe-btn--secondary">Cancel</button></div></div></div></section></div>
</body>
</html>
