<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CapacityMeter</title>
<style>html,body{margin:0}body{padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.stack{display:grid;gap:var(--space-6);max-width:420px}</style>
</head>
<body>
<div class="stack"><div class="pe-meter"><div class="pe-meter__row"><span class="pe-meter__name">Face Painting</span><span class="pe-badge pe-badge--positive"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Open</span></div><div class="pe-meter__track" role="img" aria-label="6 of 12 places taken"><div class="pe-meter__fill" style="width:50%"></div></div><div class="pe-meter__row"><span>6 of 12 places taken</span><span class="pe-meter__note">Includes the chair</span></div></div><div class="pe-meter pe-meter--caution"><div class="pe-meter__row"><span class="pe-meter__name">Haunted Hallway</span><span class="pe-badge pe-badge--positive"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Open</span></div><div class="pe-meter__track" role="img" aria-label="9 of 10 places taken"><div class="pe-meter__fill" style="width:90%"></div></div><div class="pe-meter__row"><span>9 of 10 places taken</span><span class="pe-meter__note">Includes the chair</span></div></div><div class="pe-meter pe-meter--critical"><div class="pe-meter__row"><span class="pe-meter__name">Bake Sale</span><span class="pe-badge pe-badge--critical"><svg class="pe-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Full</span></div><div class="pe-meter__track" role="img" aria-label="8 of 8 places taken"><div class="pe-meter__fill" style="width:100%"></div></div><div class="pe-meter__row"><span>8 of 8 places taken</span><span class="pe-meter__note">3 on the waiting list</span></div></div></div>
</body>
</html>
