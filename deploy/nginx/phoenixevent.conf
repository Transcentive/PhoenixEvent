# PhoenixEvent: nginx site for one address, on Ubuntu 22.04.
#
# Each organization has its own address (spec 4A.1), and during testing each
# address has its own site file and its own Let's Encrypt certificate (4A.5).
# Install this template once per address:
#
#   ADDRESS=lincolnpta.phoenixevent.tomsherlock.space
#   sudo cp deploy/nginx/phoenixevent.conf /etc/nginx/sites-available/$ADDRESS.conf
#   sudo sed -i "s/PHOENIXEVENT_ADDRESS/$ADDRESS/g" /etc/nginx/sites-available/$ADDRESS.conf
#   sudo ln -sf /etc/nginx/sites-available/$ADDRESS.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d $ADDRESS
#
# certbot adds the port 443 listener, the certificate paths and the redirect
# from plain HTTP to this file, and rewrites them at renewal. That is why this
# file belongs to the host and scripts/deploy.sh never ships it.
#
# The two snippets it includes must be in place first. scripts/deploy.sh ships
# them on every deploy; docs/installation.md gives the one-time install.

server {
    listen 80;
    listen [::]:80;
    server_name PHOENIXEVENT_ADDRESS;

    root /srv/phoenixevent/app/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploads arrive in a later phase, which sets this to the agreed limits.
    client_max_body_size 2m;

    location /api/ {
        # 8082: ports 8080 and 8081 belong to the other two services on the
        # test droplet (spec 2A.4).
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # The API reads the organization from this address (spec 4A.5).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/phoenixevent-security-headers.conf;
    }

    # The web client's routes and what may be cached. Shipped by deploy.sh.
    include /etc/nginx/snippets/phoenixevent-app.conf;
}
