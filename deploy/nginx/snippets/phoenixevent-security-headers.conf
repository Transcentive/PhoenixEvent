# PhoenixEvent: the security headers, in one place (spec 2A.3, droplet
# settings). The same three The Mighty Queue's droplet sends.
#
# Included from every location block, because nginx drops inherited add_header
# directives in any block that defines one of its own.
#
# Strict-Transport-Security is absent, as it is on The Mighty Queue.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
