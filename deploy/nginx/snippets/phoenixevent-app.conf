# PhoenixEvent: the application's own nginx rules.
#
# Included from each site's server block, and SHIPPED BY scripts/deploy.sh, so
# this file is the repository's to own. Installed at
# /etc/nginx/snippets/phoenixevent-app.conf.
#
# What is deliberately NOT here, because it belongs to the host: server_name,
# root, the /api/ proxy and its port, and everything certbot writes.
#
# nginx drops every inherited add_header in a block that defines one of its
# own, so each block below includes the security headers itself.

# Every client-side route resolves to index.html; React Router takes it from
# there. Without this, reloading any page but the first is a 404.
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/phoenixevent-security-headers.conf;
}

# Never cached, or a deploy would stay invisible until the cache expired.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/snippets/phoenixevent-security-headers.conf;
}

# Vite fingerprints these, so a changed file is a changed name.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/phoenixevent-security-headers.conf;
}
